<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>André Leão</title>
    <link rel="icon" href="assets/A.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="shutters" aria-hidden="true">
      <div class="shutter shutter-left"></div>
      <div class="shutter shutter-right"></div>
    </div>

    <main class="landing">
      <header class="site-header">
        <h1>Honda</h1>
      </header>

      <section class="hero-section">
        <div class="hero-stage">
          <p class="hero-copy" aria-label="Viva o sonho de dirigir Honda comigo">
            <span class="line-xl" style="--delay: 1.25s">Viva o sonho de</span>
            <span class="line-pair">
              <span class="line-lg" style="--delay: 2s">dirigir</span>
              <span class="brand-stack">
                <span class="line-honda" style="--delay: 2.7s">
                  <span class="honda-badge">Honda</span>
                </span>
                <span class="line-comigo" style="--delay: 3.25s">comigo</span>
              </span>
            </span>
          </p>
          <span class="hero-man-frame" style="--delay: 3.65s">
            <img class="hero-man" src="assets/andre.webp" alt="" aria-hidden="true" />
          </span>
          <span class="hero-set-frame" style="--delay: 3.65s">
            <img class="hero-set" src="assets/set.webp" alt="" aria-hidden="true" />
          </span>
          <span class="hero-name" style="--delay: 3.9s">André Leão</span>
        </div>
      </section>

      <section class="red-band" aria-label="Formulário de contato">
        <form class="lead-form">
          <div class="lead-form-header">
            <h2>Fale comigo</h2>
            <p>Preencha seus dados e conte brevemente qual o seu sonho!</p>
          </div>

          <div class="lead-form-grid">
            <label>
              <span>Nome completo</span>
              <input type="text" name="nome" autocomplete="name" required />
            </label>

            <label>
              <span>Telefone</span>
              <div class="phone-control">
                <select name="paisTelefone" aria-label="País do telefone">
                  <option value="BR" selected>BR +55</option>
                  <option value="US">US +1</option>
                  <option value="CA">CA +1</option>
                  <option value="MX">MX +52</option>
                  <option value="PT">PT +351</option>
                  <option value="ES">ES +34</option>
                  <option value="FR">FR +33</option>
                  <option value="DE">DE +49</option>
                  <option value="IT">IT +39</option>
                  <option value="GB">GB +44</option>
                  <option value="IE">IE +353</option>
                  <option value="AR">AR +54</option>
                  <option value="CL">CL +56</option>
                  <option value="UY">UY +598</option>
                  <option value="PY">PY +595</option>
                  <option value="BO">BO +591</option>
                  <option value="PE">PE +51</option>
                  <option value="CO">CO +57</option>
                  <option value="VE">VE +58</option>
                  <option value="EC">EC +593</option>
                  <option value="AU">AU +61</option>
                  <option value="NZ">NZ +64</option>
                  <option value="JP">JP +81</option>
                  <option value="CN">CN +86</option>
                  <option value="IN">IN +91</option>
                  <option value="ZA">ZA +27</option>
                </select>
                <input type="tel" name="telefone" autocomplete="tel" inputmode="numeric" required />
              </div>
            </label>

            <label>
              <span>E-mail <small>(Opcional)</small></span>
              <input type="email" name="email" autocomplete="email" />
            </label>

            <label>
              <span>Modelo de interesse <small>(Opcional)</small></span>
              <select name="modelo">
                <option value="">Clique para selecionar o modelo</option>
                <option value="POP 110i ES">POP 110i ES</option>
                <option value="POP 110i +10">POP 110i +10</option>
                <option value="BIZ 125 ES">BIZ 125 ES</option>
                <option value="BIZ 125 EX">BIZ 125 EX</option>
                <option value="ELITE 125">ELITE 125</option>
                <option value="PCX CBS">PCX CBS</option>
                <option value="PCX ABS">PCX ABS</option>
                <option value="Honda ADV 160">Honda ADV 160</option>
                <option value="CG 160 START">CG 160 START</option>
                <option value="CG 160 FAN">CG 160 FAN</option>
                <option value="CG 160 TITAN">CG 160 TITAN</option>
                <option value="NXR 160 BROS CBS">NXR 160 BROS CBS</option>
                <option value="NXR 160 BROS ABS">NXR 160 BROS ABS</option>
                <option value="CB 300F TWISTER ABS">CB 300F TWISTER ABS</option>
                <option value="XRE 190">XRE 190</option>
                <option value="XRE 300 SAHARA ABS">XRE 300 SAHARA ABS</option>
                <option value="XRE 300 SAHARA ADV">XRE 300 SAHARA ADV</option>
                <option value="XR 300L TORNADO">XR 300L TORNADO</option>
                <option value="CRF 300F">CRF 300F</option>
                <option value="CB 500 HORNET">CB 500 HORNET</option>
                <option value="CB 750 HORNET">CB 750 HORNET</option>
                <option value="CB 1000 HORNET 70%">CB 1000 HORNET 70%</option>
                <option value="NX 500">NX 500</option>
                <option value="NC 750X">NC 750X</option>
                <option value="XL 750 TRANSALP">XL 750 TRANSALP</option>
                <option value="CB 650R">CB 650R</option>
                <option value="CRF 1100L 70%">CRF 1100L 70%</option>
                <option value="TRX 420FM">TRX 420FM</option>
                <option value="CB 1000R">CB 1000R</option>
                <option value="AFRICA TWIN 1100L MT">AFRICA TWIN 1100L MT</option>
              </select>
            </label>
          </div>

          <label class="lead-description">
            <span>Descrição breve <small>(Opcional)</small></span>
            <textarea
              name="descricao"
              rows="4"
              placeholder="Ex: Quero simular parcelas, tenho interesse..."
            ></textarea>
          </label>

          <button type="submit">Enviar</button>
        </form>
      </section>

      <section class="white-band">
        <div class="white-band-track">
          <p>Condições especiais para você realizar o seu sonho ainda hoje&nbsp;&nbsp;&nbsp;</p>
          <p>Condições especiais para você realizar o seu sonho ainda hoje&nbsp;&nbsp;&nbsp;</p>
        </div>
      </section>
    </main>
  </body>
</html>
